<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact Quick Editor</title>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
  :root {
    --ink: #23303e;
    --ink-soft: #5b6b7b;
    --line: #d8dee6;
    --field-bg: #ffffff;
    --panel-bg: #f7f9fb;
    --accent: #1668a8;
    --accent-ink: #ffffff;
    --ok: #1c7c4d;
    --err: #b3281e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--panel-bg);
    color: var(--ink);
    font: 13px/1.45 "Lato", "Segoe UI", Arial, sans-serif;
  }

  .wrap {
    width: 100%;
    padding: 14px 18px 20px;
  }

  /* -------- states -------- */
  .state { padding: 28px 8px; text-align: center; color: var(--ink-soft); }
  .state.error { color: var(--err); }
  .hidden { display: none !important; }

  /* -------- sections -------- */
  fieldset {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field-bg);
    padding: 12px 14px 14px;
    margin: 0 0 14px;
  }
  legend {
    padding: 0 6px;
    font-weight: 700;
    font-size: 13px;
  }

  /* Fluid grid: as many columns as fit, min 220px each.
     Wide widget area -> 4 columns; narrow/mobile -> stacks to 1. */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px 14px;
  }

  label {
    display: block;
    margin-bottom: 3px;
    color: var(--ink-soft);
    font-size: 12px;
  }
  label .req { color: var(--err); }

  input, select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    color: var(--ink);
    background: #fff;
  }
  input:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: var(--accent);
  }

  .cep-row { display: flex; gap: 8px; }
  .cep-row input { flex: 1; }

  .hint { margin: 4px 0 0; font-size: 11.5px; color: var(--ink-soft); }
  .hint.err { color: var(--err); }
  .hint.ok  { color: var(--ok); }

  /* -------- buttons -------- */
  button {
    font: inherit;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 7px 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: .55; cursor: default; }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
  }
  button.primary:hover:not(:disabled) { background: #125685; color: #fff; }

  .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .actions .status { font-size: 12.5px; }
  .actions .status.ok  { color: var(--ok); }
  .actions .status.err { color: var(--err); }

  @media (max-width: 480px) {
    .wrap { padding: 12px 12px 16px; }
    .actions button { flex: 1 1 auto; }
    .actions .status { flex-basis: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="stateLoading" class="state">Loading contact…</div>
  <div id="stateError" class="state error hidden"></div>

  <div id="form" class="hidden">

    <fieldset>
      <legend>Contact details</legend>
      <div class="grid">
        <div>
          <label for="firstName">First name</label>
          <input id="firstName" type="text" autocomplete="off" />
        </div>
        <div>
          <label for="lastName">Last name <span class="req">*</span></label>
          <input id="lastName" type="text" autocomplete="off" />
        </div>
        <div>
          <label for="phone">Phone</label>
          <input id="phone" type="tel" autocomplete="off" />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="off" />
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Mailing address</legend>
      <div class="grid">
        <div>
          <label for="country">Country</label>
          <select id="country"></select>
        </div>
        <div>
          <label for="zip">Postal code</label>
          <div class="cep-row">
            <input id="zip" type="text" placeholder="e.g. 70040-010 / 90210" autocomplete="off" />
            <button id="lookupBtn" type="button">Look up</button>
          </div>
          <p id="cepHint" class="hint">Pick the country, enter a postal code, and city and state fill in automatically.</p>
        </div>
        <div>
          <label for="street">Street (manual)</label>
          <input id="street" type="text" autocomplete="off" />
        </div>
        <div>
          <label for="city">City</label>
          <input id="city" type="text" autocomplete="off" />
        </div>
        <div>
          <label for="state">State / Province</label>
          <input id="state" type="text" autocomplete="off" />
        </div>
      </div>
    </fieldset>

    <div class="actions">
      <button id="saveBtn" class="primary" type="button">Save to CRM</button>
      <button id="reloadBtn" type="button">Reload from CRM</button>
      <span id="saveStatus" class="status" role="status"></span>
    </div>
  </div>

</div>

<script>
(() => {
  "use strict";

  const ENTITY = "Contacts";

  // CRM field API name -> input element id
  const FIELD_MAP = Object.freeze({
    First_Name:      "firstName",
    Last_Name:       "lastName",
    Phone:           "phone",
    Email:           "email",
    Mailing_Zip:     "zip",
    Mailing_Street:  "street",
    Mailing_City:    "city",
    Mailing_State:   "state",
    Mailing_Country: "country",
  });

  let recordId = null;

  const elementId = (id) => document.getElementById(id);

  /* ---------------- Countries (Zippopotam-supported subset) ---------------- */

  const COUNTRIES = [
    ["AR", "Argentina"], ["AU", "Australia"], ["AT", "Austria"],
    ["BE", "Belgium"], ["BR", "Brazil"], ["CA", "Canada"],
    ["CZ", "Czechia"], ["DK", "Denmark"], ["FI", "Finland"],
    ["FR", "France"], ["DE", "Germany"], ["HU", "Hungary"],
    ["IN", "India"], ["IT", "Italy"], ["JP", "Japan"],
    ["MX", "Mexico"], ["NL", "Netherlands"], ["NZ", "New Zealand"],
    ["NO", "Norway"], ["PH", "Philippines"], ["PL", "Poland"],
    ["PT", "Portugal"], ["RO", "Romania"], ["SK", "Slovakia"],
    ["ZA", "South Africa"], ["ES", "Spain"], ["SE", "Sweden"],
    ["CH", "Switzerland"], ["TH", "Thailand"], ["TR", "Turkey"],
    ["GB", "United Kingdom"], ["US", "United States"],
  ];

  const countrySelect = () => elementId("country");

  const populateCountries = () => {
    countrySelect().innerHTML = COUNTRIES
      .map(([code, name]) => `<option value="${name}" data-code="${code}">${name}</option>`)
      .join("");
    countrySelect().value = "Brazil"; // sensible default; overwritten by the record on load
  };

  // The record may hold a country outside our lookup list (or spelled
  // differently, e.g. "Brasil"). Keep it selectable so loading never
  // silently rewrites CRM data — it just won't have lookup support.
  const ensureCountryOption = (name) => {
    if (!name) return;
    const match = [...countrySelect().options]
      .find((option) => option.value.toLowerCase() === name.toLowerCase());
    if (match) {
      countrySelect().value = match.value;
      return;
    }
    const option = new Option(name, name);
    countrySelect().add(option);
    countrySelect().value = name;
  };

  /* ---------------- UI helpers ---------------- */

  const show = (id) => elementId(id).classList.remove("hidden");
  const hide = (id) => elementId(id).classList.add("hidden");

  const fatal = (msg) => {
    hide("stateLoading");
    hide("form");
    elementId("stateError").textContent = msg;
    show("stateError");
    resize();
  };

  const setStatus = (el, text = "", tone = "") => {
    const node = elementId(el);
    node.textContent = text;
    node.className = `${node.className.split(" ")[0]} ${tone}`.trim();
  };

  const setSaveStatus = (text, tone) => setStatus("saveStatus", text, tone);
  const setCepHint    = (text, tone) => setStatus("cepHint", text, tone);

  const resize = () => {
    try {
      ZOHO.CRM.UI.Resize({ height: String(document.body.scrollHeight + 12), width: "100%" });
    } catch { /* older SDK builds: ignore */ }
  };

  // Keep the iframe height in sync with the content: fires on load, on
  // grid reflow (columns collapsing), and whenever hints/status lines wrap.
  let resizeQueued = false;
  const queueResize = () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => {
      resizeQueued = false;
      resize();
    });
  };
  new ResizeObserver(queueResize).observe(document.body);

  /* ---------------- Load record ---------------- */

  const fillForm = (record) => {
    for (const [apiName, inputId] of Object.entries(FIELD_MAP)) {
      if (inputId === "country") {
        ensureCountryOption(record[apiName]);
      } else {
        elementId(inputId).value = record[apiName] ?? "";
      }
    }
  };

  const loadRecord = async () => {
    hide("form");
    hide("stateError");
    show("stateLoading");
    setSaveStatus();

    try {
      const { data } = await ZOHO.CRM.API.getRecord({ Entity: ENTITY, RecordID: recordId });
      const record = data?.[0];
      if (!record) return fatal("Could not read this contact record from CRM.");

      fillForm(record);
      hide("stateLoading");
      show("form");
      resize();
    } catch {
      fatal("Failed to load the contact. Reload the record page and try again.");
    }
  };

  /* ---------------- Save record ---------------- */

  const readForm = () =>
    Object.fromEntries(
      Object.entries(FIELD_MAP).map(([apiName, inputId]) => [apiName, elementId(inputId).value.trim()])
    );

  const saveRecord = async () => {
    if (!elementId("lastName").value.trim()) {
      setSaveStatus("Last name is required by Zoho CRM.", "err");
      elementId("lastName").focus();
      return;
    }

    elementId("saveBtn").disabled = true;
    setSaveStatus("Saving…");

    try {
      const { data } = await ZOHO.CRM.API.updateRecord({
        Entity: ENTITY,
        APIData: { id: recordId, ...readForm() },
        Trigger: ["workflow"],
      });

      const result = data?.[0];
      result?.code === "SUCCESS"
        ? setSaveStatus("Saved to CRM.", "ok")
        : setSaveStatus(`Save failed: ${result?.message ?? "unknown error."}`, "err");
    } catch {
      setSaveStatus("Save failed: could not reach CRM.", "err");
    } finally {
      elementId("saveBtn").disabled = false;
    }
  };

  /* ------------- Postal code lookup (ViaCEP for BR, Zippopotam elsewhere) ------------- */

  const fillAddress = ({ city, state }) => {
    elementId("city").value = city ?? "";
    elementId("state").value = state ?? "";
    setCepHint("City and state filled. Review, add the street, then save.", "ok");
  };

  const lookupViaCep = async () => {
    const cep = elementId("zip").value.replace(/\D/g, "");
    if (cep.length !== 8) {
      setCepHint("A Brazilian CEP has 8 digits (e.g. 70040-010).", "err");
      return;
    }

    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    if (data.erro) {
      setCepHint("CEP not found. Check the number or fill the address manually.", "err");
      return;
    }

    elementId("zip").value = `${cep.slice(0, 5)}-${cep.slice(5)}`;
    fillAddress({ city: data.localidade, state: data.estado ?? data.uf });
  };

  // Zippopotam matches on the code's prefix form in some countries.
  const normalizeForZippopotam = (code, countryCode) => {
    const clean = code.trim().toUpperCase();
    if (countryCode === "GB") return clean.split(/\s+/)[0]; // outward code, e.g. "SW1A"
    if (countryCode === "CA") return clean.replace(/\s+/g, "").slice(0, 3); // FSA, e.g. "K1A"
    return clean;
  };

  const lookupZippopotam = async (countryCode) => {
    const code = normalizeForZippopotam(elementId("zip").value, countryCode);
    if (!code) {
      setCepHint("Enter a postal code first.", "err");
      return;
    }

    const response = await fetch(
      `https://api.zippopotam.us/${countryCode.toLowerCase()}/${encodeURIComponent(code)}`
    );
    if (response.status === 404) {
      setCepHint("Postal code not found for this country. Check it or fill the address manually.", "err");
      return;
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    const place = data.places?.[0];
    if (!place) {
      setCepHint("No place data returned. Fill the address manually.", "err");
      return;
    }

    fillAddress({ city: place["place name"], state: place.state || place["state abbreviation"] });
  };

  const lookupPostalCode = async () => {
    const countryCode = countrySelect().selectedOptions[0]?.dataset.code;
    if (!countryCode) {
      setCepHint("Lookup isn't available for this country — fill the address manually.", "err");
      return;
    }

    elementId("lookupBtn").disabled = true;
    setCepHint("Looking up postal code…");

    try {
      await (countryCode === "BR" ? lookupViaCep() : lookupZippopotam(countryCode));
    } catch {
      setCepHint("Lookup failed (network or API error). You can fill the address manually.", "err");
    } finally {
      elementId("lookupBtn").disabled = false;
    }
  };

  /* ---------------- Wire up ---------------- */

  populateCountries();

  elementId("saveBtn").addEventListener("click", saveRecord);
  elementId("reloadBtn").addEventListener("click", loadRecord);
  elementId("lookupBtn").addEventListener("click", lookupPostalCode);
  elementId("zip").addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      lookupPostalCode();
    }
  });

  // Guard: opened outside the CRM iframe (double-clicked file, plain browser tab).
  if (typeof ZOHO === "undefined") {
    fatal("This widget only runs inside Zoho CRM. Install it and open it from a Contact record.");
    return;
  }

  ZOHO.embeddedApp.on("PageLoad", (page) => {
    if (page?.Entity !== ENTITY || !page?.EntityId) {
      fatal("This widget must be placed on a Contact record detail page.");
      return;
    }
    recordId = Array.isArray(page.EntityId) ? page.EntityId[0] : page.EntityId;
    loadRecord();
  });

  ZOHO.embeddedApp.init();
})();
</script>
</body>
</html>
